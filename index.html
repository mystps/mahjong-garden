html,body{margin:0;padding:0;height:100%;background:#16231a;font-family:"NunitoNum",Arial,Helvetica,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
#app{position:relative;margin:0 auto;width:100%;max-width:460px;background:#35523a;overflow:hidden;box-shadow:0 0 30px #000000;}
#top{background:#3b2a1c;padding:8px 10px 4px 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:3px solid #261a10;}
#sizes{display:flex;}
.pill{flex:1;height:46px;padding:0;margin:0 3px 6px 3px;border:2px solid #7a5533;border-radius:16px;background:#f3e7c8;color:#3b2a1c;cursor:pointer;box-shadow:0 3px 0 #1f140b;}
.pill svg{width:30px;height:30px;display:block;margin:0 auto;}
.pill.on{background:#f2b134;border-color:#b86f12;}
#bInfo{flex:none;width:46px;}
#bInfo svg{width:26px;height:26px;}
#credits{display:none;position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(22,35,26,0.97);z-index:20;color:#f3e7c8;text-align:center;padding:90px 28px 0 28px;font-size:18px;line-height:1.6;font-family:Arial,Helvetica,sans-serif;}
#credits b{font-size:20px;}
#cnt{flex:none;width:58px;text-align:center;font-size:26px;font-weight:800;color:#e9d9a6;line-height:46px;margin:0 3px 6px 3px;}
canvas{display:block;}
#actions{display:flex;background:#3b2a1c;padding:8px 6px;padding-bottom:calc(8px + env(safe-area-inset-bottom));border-top:3px solid #261a10;}
.act{flex:1;min-height:60px;margin:0 3px;border:2px solid #7a5533;border-radius:16px;background:#f3e7c8;color:#3b2a1c;cursor:pointer;padding:0;box-shadow:0 3px 0 #1f140b;}
.act svg{width:34px;height:34px;display:block;margin:0 auto;}
.act:active{background:#f2d98a;box-shadow:0 1px 0 #1f140b;position:relative;top:2px;}
.act.pulse{animation:pulse 0.8s infinite;}
@keyframes pulse{0%{background:#f3e7c8;}50%{background:#f2b134;}100%{background:#f3e7c8;}}
#win{display:none;position:absolute;left:12%;right:12%;top:30%;background:#f8efd6;border:6px solid #f2b134;border-radius:24px;text-align:center;padding:20px 14px 24px 14px;z-index:10;box-shadow:0 0 40px rgba(0,0,0,0.6);}
#win svg.big{width:110px;height:110px;display:block;margin:0 auto 14px auto;color:#3f7a3a;}
#win .act{flex:none;width:70%;margin:0 auto;}
#leaves{display:none;position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden;z-index:11;}
#win[style*="block"] + #leaves{display:block;}
#leaves i{position:absolute;left:0;top:0;display:block;opacity:0.95;will-change:transform;}
#leaves i svg{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="sizes">
      <button class="pill" id="bSmall" aria-label="Small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></svg></button>
      <button class="pill" id="bMedium" aria-label="Medium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-1.5 4) scale(0.62)"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></g><g transform="translate(13 4) scale(0.62)"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></g></svg></button>
      <button class="pill" id="bLarge" aria-label="Large"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0.5) scale(0.5)"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></g><g transform="translate(12 0.5) scale(0.5)"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></g><g transform="translate(6 11.5) scale(0.5)"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></g><g transform="translate(18 11.5) scale(0.5)" opacity="0"><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" /> <path d="M12 22v-3" /></g></svg></button>
      <div id="cnt"></div>
      <button class="pill" id="bInfo" aria-label="Credits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="10" /> <path d="M12 16v-4" /> <path d="M12 8h.01" /></svg></button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <div id="actions">
    <button class="act" id="bNew" aria-label="New game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /></svg></button>
    <button class="act" id="bHint" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#c98a0b"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /> <path d="M9 18h6" /> <path d="M10 22h4" /></svg></button>
    <button class="act" id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 14 4 9l5-5" /> <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></svg></button>
    <button class="act" id="bShuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="m18 14 4 4-4 4" /> <path d="m18 2 4 4-4 4" /> <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" /> <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" /> <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" /></svg></button>
  </div>
  <div id="credits">Open source art<br><b>OpenMoji</b> - openmoji.org<br>CC BY-SA 4.0<br><br>Icons: Lucide - lucide.dev<br>ISC License</div>
  <div id="win">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="big"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z" /> <path d="M7 16v6" /> <path d="M13 19v3" /> <path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5" /></svg>
    <button class="act" id="bAgain" aria-label="Play again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /></svg></button>
  </div>
  <div id="leaves"></div>
</div>

<script>
(function () {
  var app = document.getElementById('app');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var cntEl = document.getElementById('cnt');
  var shuffleBtn = document.getElementById('bShuffle');
  var flashIdx = -1, flashTimer = null;
  var topEl = document.getElementById('top');
  var actEl = document.getElementById('actions');
  var winEl = document.getElementById('win');

  var tiles = [], order = [], freeFlags = [], undoStack = [];
  var selected = -1, hintPair = null, hintPhase = 0, hintTimer = null;
  var layoutName = 'small';
  var G = { u: 30, v: 39, ox: 0, oy: 0, lo: 8, dd: 6 };
  var cssW = 360, cssH = 500, dpr = 1;

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function seq(a, b, s) {
    var r = [], i;
    for (i = a; i <= b; i += s) { r.push(i); }
    return r;
  }
  function setMsg(s) { /* no text in the interface */ }
  function flashTile(i) {
    flashIdx = i;
    if (flashTimer) { clearTimeout(flashTimer); }
    draw();
    flashTimer = setTimeout(function () { flashIdx = -1; flashTimer = null; draw(); }, 350);
  }

  // ---------- layouts (vertical, for a phone held upright) ----------
  function buildLayout(name) {
    var p = [], i, j;
    function add(l, x, y) { p.push({ layer: l, x: x, y: y, type: 0, alive: true }); }
    function block(l, xl, yl) {
      for (j = 0; j < yl.length; j++) { for (i = 0; i < xl.length; i++) { add(l, xl[i], yl[j]); } }
    }
    if (name === 'small') {            // 36 tiles
      block(0, seq(0, 6, 2), seq(0, 10, 2));
      block(1, [1, 3, 5], seq(2, 8, 2));
    } else if (name === 'medium') {    // 72 tiles
      block(0, seq(0, 8, 2), seq(0, 14, 2));
      block(1, seq(1, 7, 2), seq(2, 12, 2));
      block(2, [3, 5], seq(4, 10, 2));
    } else {                           // 100 tiles
      block(0, seq(0, 10, 2), seq(0, 14, 2));
      block(1, seq(1, 9, 2), seq(2, 12, 2));
      block(2, seq(2, 8, 2), seq(4, 10, 2));
      block(3, [4, 6], [5, 7, 9]);
    }
    return p;
  }

  // ---------- game logic ----------
  function isFree(i) {
    var t = tiles[i], left = false, right = false, k, o, dy;
    for (k = 0; k < tiles.length; k++) {
      if (k === i) { continue; }
      o = tiles[k];
      if (!o.alive) { continue; }
      dy = Math.abs(o.y - t.y);
      if (o.layer > t.layer) {
        if (Math.abs(o.x - t.x) < 2 && dy < 2) { return false; }
      } else if (o.layer === t.layer && dy < 2) {
        if (o.x === t.x - 2) { left = true; }
        else if (o.x === t.x + 2) { right = true; }
      }
    }
    return !(left && right);
  }

  function computeFree() {
    var i;
    freeFlags = [];
    for (i = 0; i < tiles.length; i++) {
      freeFlags.push(tiles[i].alive ? isFree(i) : false);
    }
  }

  function generate(idx, pairs) {
    var attempt, k, step, free, a, b, ok, pl;
    for (attempt = 0; attempt < 400; attempt++) {
      for (k = 0; k < idx.length; k++) { tiles[idx[k]].alive = true; }
      pl = shuffle(pairs.slice());
      ok = true;
      for (step = 0; step < pl.length; step++) {
        free = [];
        for (k = 0; k < idx.length; k++) {
          if (tiles[idx[k]].alive && isFree(idx[k])) { free.push(idx[k]); }
        }
        if (free.length < 2) { ok = false; break; }
        a = free.splice(rnd(free.length), 1)[0];
        b = free[rnd(free.length)];
        tiles[a].type = pl[step];
        tiles[b].type = pl[step];
        tiles[a].alive = false;
        tiles[b].alive = false;
      }
      for (k = 0; k < idx.length; k++) { tiles[idx[k]].alive = true; }
      if (ok) { return true; }
    }
    return false;
  }

  function allPairs() {
    var r = [], t;
    for (t = 0; t < TYPES; t++) { r.push(t); r.push(t); }
    return r;
  }

  function sortOrder() {
    order = [];
    var i;
    for (i = 0; i < tiles.length; i++) { order.push(i); }
    order.sort(function (a, b) {
      var A = tiles[a], B = tiles[b];
      if (A.layer !== B.layer) { return A.layer - B.layer; }
      if (A.y !== B.y) { return A.y - B.y; }
      return A.x - B.x;
    });
  }

  function newGame() {
    var idx = [], i, pairs;
    stopHint();
    tiles = buildLayout(layoutName);
    for (i = 0; i < tiles.length; i++) { idx.push(i); }
    pairs = shuffle(allPairs()).slice(0, tiles.length / 2);
    generate(idx, pairs);
    sortOrder();
    undoStack = [];
    selected = -1;
    winEl.style.display = 'none';
    setMsg('Уберите две одинаковые светлые плитки.');
    refresh();
  }

  function aliveCount() {
    var n = 0, i;
    for (i = 0; i < tiles.length; i++) { if (tiles[i].alive) { n++; } }
    return n;
  }

  function findPairs() {
    var byType = {}, res = [], i, t, g, x, y;
    for (i = 0; i < tiles.length; i++) {
      if (tiles[i].alive && freeFlags[i]) {
        t = tiles[i].type;
        if (!byType[t]) { byType[t] = []; }
        byType[t].push(i);
      }
    }
    for (t in byType) {
      if (byType.hasOwnProperty(t)) {
        g = byType[t];
        for (x = 0; x < g.length; x++) {
          for (y = x + 1; y < g.length; y++) { res.push([g[x], g[y]]); }
        }
      }
    }
    return res;
  }

  function movesCount() {
    var byType = {}, i, t, n = 0;
    for (i = 0; i < tiles.length; i++) {
      if (tiles[i].alive && freeFlags[i]) {
        t = tiles[i].type;
        byType[t] = (byType[t] || 0) + 1;
      }
    }
    for (t in byType) { if (byType.hasOwnProperty(t)) { n += Math.floor(byType[t] / 2); } }
    return n;
  }

  function checkEnd() {
    if (aliveCount() === 0) {
      winEl.style.display = 'block';
      setMsg('');
      return;
    }
    if (findPairs().length === 0) {
      shuffleBtn.className = 'act pulse';
    }
  }

  function removePair(a, b) {
    tiles[a].alive = false;
    tiles[b].alive = false;
    undoStack.push([a, b]);
    selected = -1;
    stopHint();
    setMsg('Хорошо!');
    refresh();
    checkEnd();
  }

  function undo() {
    if (undoStack.length === 0) { setMsg('Отменять нечего.'); return; }
    var p = undoStack.pop();
    tiles[p[0]].alive = true;
    tiles[p[1]].alive = true;
    selected = -1;
    stopHint();
    winEl.style.display = 'none';
    setMsg('Ход отменён.');
    refresh();
  }

  function reshuffle() {
    var idx = [], counts = {}, pairs = [], i, t, c;
    for (i = 0; i < tiles.length; i++) {
      if (tiles[i].alive) {
        idx.push(i);
        counts[tiles[i].type] = (counts[tiles[i].type] || 0) + 1;
      }
    }
    if (idx.length === 0) { return; }
    for (t in counts) {
      if (counts.hasOwnProperty(t)) {
        for (c = 0; c < Math.floor(counts[t] / 2); c++) { pairs.push(parseInt(t, 10)); }
      }
    }
    stopHint();
    selected = -1;
    if (generate(idx, pairs)) { setMsg('Плитки перемешаны.'); }
    else { setMsg('Не получилось перемешать. Попробуйте ещё раз.'); }
    undoStack = [];
    refresh();
    checkEnd();
  }

  function stopHint() {
    if (hintTimer) { clearInterval(hintTimer); hintTimer = null; }
    hintPair = null;
  }
  function showHint() {
    var ps = findPairs();
    stopHint();
    if (aliveCount() === 0) { return; }
    if (ps.length === 0) {
      shuffleBtn.className = 'act pulse';
      return;
    }
    hintPair = ps[rnd(ps.length)];
    hintPhase = 0;
    selected = -1;
    setMsg('Две одинаковые плитки мигают зелёным.');
    draw();
    hintTimer = setInterval(function () {
      hintPhase++;
      draw();
      if (hintPhase > 9) { stopHint(); draw(); }
    }, 400);
  }

  // ---------- geometry ----------
  function resize() {
    var appH = Math.min(window.innerHeight, 940);
    app.style.height = appH + 'px';
    var w = app.clientWidth;
    var h = appH - topEl.offsetHeight - actEl.offsetHeight;
    if (h < 150) { h = 150; }
    dpr = window.devicePixelRatio || 1;
    if (dpr > 3) { dpr = 3; }
    cssW = w;
    cssH = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }

  function computeGeom() {
    var maxX = 0, maxY = 0, maxL = 0, i, t, W = cssW, H = cssH;
    for (i = 0; i < tiles.length; i++) {
      t = tiles[i];
      if (t.x + 2 > maxX) { maxX = t.x + 2; }
      if (t.y + 2 > maxY) { maxY = t.y + 2; }
      if (t.layer > maxL) { maxL = t.layer; }
    }
    var u1 = (W - 14) / (maxX + 0.3 + 0.28 * maxL);
    var u2 = (H - 10) / (1.3 * maxY + 0.3 + 0.28 * maxL);
    var u = Math.min(u1, u2, 62);
    if (u < 8) { u = 8; }
    G.u = u;
    G.v = u * 1.3;
    G.lo = u * 0.28;
    G.dd = u * 0.3;
    var totalW = maxX * u + G.dd + maxL * G.lo;
    var totalH = maxY * G.v + G.dd + maxL * G.lo;
    G.ox = Math.round((W - totalW) / 2 + maxL * G.lo);
    G.oy = Math.round((H - totalH) / 2 + maxL * G.lo);
  }

  function tileRect(i) {
    var t = tiles[i];
    return {
      x: G.ox + t.x * G.u - t.layer * G.lo,
      y: G.oy + t.y * G.v - t.layer * G.lo,
      w: 2 * G.u,
      h: 2 * G.v
    };
  }

  function hitTest(px, py) {
    var k, i, r;
    for (k = order.length - 1; k >= 0; k--) {
      i = order[k];
      if (!tiles[i].alive) { continue; }
      r = tileRect(i);
      if (px >= r.x && px <= r.x + r.w + G.dd && py >= r.y && py <= r.y + r.h + G.dd) { return i; }
    }
    return -1;
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function circle(cx, cy, r, fill, stroke, lw) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2, false);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw || 1; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  // Tile pictures: OpenMoji (https://openmoji.org), CC BY-SA 4.0.

  var TYPES = FACE_SRC.length;
  var FACES = [], facesLoaded = 0;
  (function () {
    var k, im;
    for (k = 0; k < FACE_SRC.length; k++) {
      im = new Image();
      im.onload = function () {
        facesLoaded++;
        if (facesLoaded === FACE_SRC.length && tiles.length) { refresh(); }
      };
      im.src = FACE_SRC[k];
      FACES.push(im);
    }
  })();

  function drawFace(type, fx, fy, fw, fh) {
    var im = FACES[type], s = fw * 0.9;
    if (im && im.complete && im.naturalWidth) {
      ctx.drawImage(im, fx + (fw - s) / 2, fy + (fh - s) / 2, s, s);
    }
  }

  function drawTile(i) {
    var t = tiles[i], r = tileRect(i), isHint = false, col, rad = G.u * 0.25;
    if (hintPair && (i === hintPair[0] || i === hintPair[1])) { isHint = true; }
    rr(r.x + G.dd, r.y + G.dd, r.w, r.h, rad);
    ctx.fillStyle = '#a97a49'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#3f2a18'; ctx.stroke();
    col = freeFlags[i] ? '#f8efd6' : '#d8c9a6';
    if (i === selected) { col = '#ffd36b'; }
    if (isHint && (hintPhase % 2 === 0)) { col = '#c4e5a4'; }
    rr(r.x, r.y, r.w, r.h, rad);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#7d5c38'; ctx.stroke();
    if (freeFlags[i]) {
      rr(r.x + 3, r.y + 3, r.w - 6, r.h - 6, Math.max(2, rad - 2));
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
    }
    drawFace(t.type, r.x, r.y, r.w, r.h);
    if (!freeFlags[i]) {
      rr(r.x, r.y, r.w, r.h, rad);
      ctx.fillStyle = 'rgba(58,42,28,0.36)'; ctx.fill();
    }
    if (i === flashIdx) {
      rr(r.x, r.y, r.w, r.h, rad);
      ctx.fillStyle = 'rgba(184,67,58,0.45)'; ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = '#b8433a'; ctx.stroke();
    } else if (i === selected) {
      rr(r.x, r.y, r.w, r.h, rad);
      ctx.lineWidth = 5; ctx.strokeStyle = '#e08a10'; ctx.stroke();
    } else if (isHint) {
      rr(r.x, r.y, r.w, r.h, rad);
      ctx.lineWidth = 5; ctx.strokeStyle = '#4f9a3a'; ctx.stroke();
    }
  }

  function draw() {
    var k;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    computeGeom();
    for (k = 0; k < order.length; k++) {
      if (tiles[order[k]].alive) { drawTile(order[k]); }
    }
  }

  function updateHud() {
    cntEl.innerHTML = String(aliveCount());
  }

  function refresh() {
    computeFree();
    if (movesCount() > 0 || aliveCount() === 0) { shuffleBtn.className = 'act'; }
    draw();
    updateHud();
  }

  function onPoint(px, py) {
    if (winEl.style.display === 'block') { return; }
    var i = hitTest(px, py);
    if (i < 0) { return; }
    if (!freeFlags[i]) {
      flashTile(i);
      return;
    }
    if (i === selected) {
      selected = -1;
      setMsg('');
      draw();
      return;
    }
    if (selected < 0) {
      selected = i;
      setMsg('Теперь найдите такую же плитку.');
      draw();
      return;
    }
    if (tiles[selected].type === tiles[i].type) {
      removePair(selected, i);
    } else {
      selected = i;
      setMsg('Плитки разные. Выберите другую пару.');
      draw();
    }
  }

  canvas.addEventListener('mousedown', function (e) {
    var b = canvas.getBoundingClientRect();
    onPoint(e.clientX - b.left, e.clientY - b.top);
  }, false);
  canvas.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches.length) {
      var b = canvas.getBoundingClientRect();
      onPoint(e.touches[0].clientX - b.left, e.touches[0].clientY - b.top);
      e.preventDefault();
    }
  }, false);

  function setLayout(name) {
    layoutName = name;
    try { window.localStorage.setItem('mahjongLayoutPhone', name); } catch (err) { }
    markLayout();
    newGame();
  }
  function markLayout() {
    var ids = { small: 'bSmall', medium: 'bMedium', large: 'bLarge' }, k;
    for (k in ids) {
      if (ids.hasOwnProperty(k)) {
        document.getElementById(ids[k]).className = 'pill' + (k === layoutName ? ' on' : '');
      }
    }
  }

  document.getElementById('bInfo').onclick = function () { document.getElementById('credits').style.display = 'block'; };
  document.getElementById('credits').onclick = function () { this.style.display = 'none'; };
  document.getElementById('bNew').onclick = newGame;
  document.getElementById('bAgain').onclick = newGame;
  document.getElementById('bHint').onclick = showHint;
  document.getElementById('bUndo').onclick = undo;
  document.getElementById('bShuffle').onclick = reshuffle;
  document.getElementById('bSmall').onclick = function () { setLayout('small'); };
  document.getElementById('bMedium').onclick = function () { setLayout('medium'); };
  document.getElementById('bLarge').onclick = function () { setLayout('large'); };
  window.onresize = function () { resize(); refresh(); };

  try {
    var saved = window.localStorage.getItem('mahjongLayoutPhone');
    if (saved === 'small' || saved === 'medium' || saved === 'large') { layoutName = saved; }
  } catch (err2) { }
  markLayout();
  resize();
  newGame();
  setTimeout(function () { resize(); refresh(); }, 100);

  window.__mj = { tiles: function () { return tiles; }, newGame: newGame, setLayout: setLayout, findPairs: findPairs, removePair: removePair, refresh: refresh, alive: aliveCount, reshuffle: reshuffle };
})();

  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

<script>
(function () {
  // Textures are generated by code at start-up (no image files).
  function make(w, h, paint) {
    var c = document.createElement('canvas'), x;
    c.width = w; c.height = h; x = c.getContext('2d');
    paint(x, w, h);
    return c.toDataURL('image/png');
  }
  function wrap(x, w, h, px, py, fn) {
    var ox, oy;
    for (ox = -1; ox <= 1; ox++) { for (oy = -1; oy <= 1; oy++) { fn(px + ox * w, py + oy * h); } }
  }
  var moss = make(256, 256, function (x, w, h) {
    var i, px, py, g, a, r;
    x.fillStyle = '#35523a'; x.fillRect(0, 0, w, h);
    for (i = 0; i < 1100; i++) {
      px = Math.random() * w; py = Math.random() * h; r = 1 + Math.random() * 3.2;
      g = Math.random();
      a = 0.10 + Math.random() * 0.16;
      x.fillStyle = g < 0.5 ? 'rgba(120,170,90,' + a + ')' : (g < 0.8 ? 'rgba(20,45,28,' + a + ')' : 'rgba(190,200,110,' + (a * 0.7) + ')');
      wrap(x, w, h, px, py, function (qx, qy) { x.beginPath(); x.arc(qx, qy, r, 0, 6.2832); x.fill(); });
    }
  });
  var bark = make(256, 64, function (x, w, h) {
    var i, py, len, px, a;
    x.fillStyle = '#3b2a1c'; x.fillRect(0, 0, w, h);
    for (i = 0; i < 46; i++) {
      py = Math.random() * h; px = Math.random() * w; len = 40 + Math.random() * 160;
      a = 0.08 + Math.random() * 0.14;
      x.strokeStyle = Math.random() < 0.5 ? 'rgba(20,12,6,' + a + ')' : 'rgba(120,85,50,' + a + ')';
      x.lineWidth = 0.6 + Math.random() * 1.4;
      wrap(x, w, h, px, py, function (qx, qy) {
        x.beginPath(); x.moveTo(qx, qy); x.bezierCurveTo(qx + len * 0.3, qy + 1.5, qx + len * 0.6, qy - 1.5, qx + len, qy + 0.5); x.stroke();
      });
    }
  });
  var app = document.getElementById('app');
  app.style.backgroundImage = 'radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(8,20,12,0.55) 100%), url(' + moss + ')';
  document.getElementById('top').style.backgroundImage = 'url(' + bark + ')';
  document.getElementById('actions').style.backgroundImage = 'url(' + bark + ')';

  // Leaves on the win screen: simple physics, finger or mouse pushes them.
  var win = document.getElementById('win'), box = document.getElementById('leaves');
  var cols = ['#d9822b', '#c4492f', '#e6b422', '#7fb04a', '#b5651d'];
  var leafSvg = '<svg viewBox="0 0 24 24" fill="COLOR" stroke="#3f2a18" stroke-width="1.2" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/></svg>';
  var L = [], N = 18, k, W = 360, H = 640, running = false, last = 0, P = { x: 0, y: 0, t: 0, on: false };
  function visible() { return win.style.display === 'block'; }
  function respawn(o, stagger) {
    o.x = 12 + Math.random() * (W - 24);
    o.y = stagger ? -Math.random() * H * 0.8 - 30 : -40;
    o.vx = (Math.random() - 0.5) * 30; o.vy = Math.random() * 30;
    o.r = Math.random() * 360; o.vr = (Math.random() - 0.5) * 90;
  }
  for (k = 0; k < N; k++) {
    var el = document.createElement('i'), sz = 32 + Math.random() * 14;
    el.style.width = sz + 'px'; el.style.height = sz + 'px';
    el.innerHTML = leafSvg.replace('COLOR', cols[k % cols.length]);
    box.appendChild(el);
    L.push({ el: el, s: sz, x: 0, y: -100, vx: 0, vy: 0, r: 0, vr: 0, t: Math.random() * 6, ph: Math.random() * 6.28 });
  }
  function push(x, y, pvx, pvy) {
    var i, o, dx, dy, d, f, R = 85, sp;
    for (i = 0; i < L.length; i++) {
      o = L[i]; dx = o.x - x; dy = o.y - y; d = Math.sqrt(dx * dx + dy * dy);
      if (d < R) {
        f = 1 - d / R;
        o.vx += pvx * 0.6 * f + (dx / (d + 1)) * 50 * f;
        o.vy += pvy * 0.6 * f + (dy / (d + 1)) * 50 * f;
        o.vr += (Math.random() - 0.5) * 500 * f + pvx * 0.15 * f;
        sp = Math.sqrt(o.vx * o.vx + o.vy * o.vy);
        if (sp > 1400) { o.vx *= 1400 / sp; o.vy *= 1400 / sp; }
      }
    }
  }
  function burst(x, y) {
    var i, o, dx, dy, d, f, R = 120;
    for (i = 0; i < L.length; i++) {
      o = L[i]; dx = o.x - x; dy = o.y - y; d = Math.sqrt(dx * dx + dy * dy);
      if (d < R) { f = 1 - d / R; o.vx += (dx / (d + 1)) * 520 * f; o.vy += (dy / (d + 1)) * 520 * f - 150 * f; o.vr += (Math.random() - 0.5) * 700 * f; }
    }
  }
  function local(cx, cy) { var rc = box.getBoundingClientRect(); return { x: cx - rc.left, y: cy - rc.top }; }
  function move(cx, cy) {
    if (!visible()) { return; }
    var q = local(cx, cy), now = (window.performance && performance.now) ? performance.now() : +new Date(), dt, pvx, pvy, sp;
    if (P.on) {
      dt = Math.max(0.008, (now - P.t) / 1000);
      pvx = (q.x - P.x) / dt; pvy = (q.y - P.y) / dt;
      sp = Math.sqrt(pvx * pvx + pvy * pvy);
      if (sp > 1800) { pvx *= 1800 / sp; pvy *= 1800 / sp; }
      push(q.x, q.y, pvx, pvy);
    }
    P.x = q.x; P.y = q.y; P.t = now; P.on = true;
  }
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; if (!t || !visible()) { return; }
    var q = local(t.clientX, t.clientY); burst(q.x, q.y);
    P.on = false; move(t.clientX, t.clientY);
  }, false);
  document.addEventListener('touchmove', function (e) { var t = e.touches[0]; if (t) { move(t.clientX, t.clientY); } }, false);
  document.addEventListener('touchend', function () { P.on = false; }, false);
  document.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); }, false);
  document.addEventListener('mouseleave', function () { P.on = false; }, false);

  function tick(now) {
    var dt = Math.min(0.034, (now - last) / 1000), i, o, dr, drr;
    last = now;
    if (!visible()) { running = false; return; }
    dr = Math.exp(-1.4 * dt); drr = Math.exp(-0.9 * dt);
    for (i = 0; i < L.length; i++) {
      o = L[i]; o.t += dt;
      o.vx += Math.sin(o.t * 2.2 + o.ph) * 55 * dt;
      o.vy += 170 * dt;
      o.vx *= dr; o.vy *= dr;
      o.x += o.vx * dt; o.y += o.vy * dt;
      o.r += o.vr * dt; o.vr *= drr;
      if (o.x < 10) { o.x = 10; o.vx = Math.abs(o.vx) * 0.6; }
      if (o.x > W - 10) { o.x = W - 10; o.vx = -Math.abs(o.vx) * 0.6; }
      if (o.y < -300) { o.y = -300; o.vy = Math.abs(o.vy) * 0.3; }
      if (o.y > H + 50) { respawn(o, false); }
      o.el.style.transform = 'translate(' + (o.x - o.s / 2).toFixed(1) + 'px,' + (o.y - o.s / 2).toFixed(1) + 'px) rotate(' + o.r.toFixed(1) + 'deg)';
    }
    requestAnimationFrame(tick);
  }
  setInterval(function () {
    var i;
    if (visible() && !running) {
      W = box.clientWidth || 360; H = box.clientHeight || 640;
      for (i = 0; i < L.length; i++) { respawn(L[i], true); }
      running = true; last = (window.performance && performance.now) ? performance.now() : +new Date();
      requestAnimationFrame(tick);
    }
  }, 150);
})();
